<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Up - My Tasks</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>
<body>
    <header>
        <h1>Next UP</h1>
    </header>
    <main>
        <section class="greeting">
            <h2> Hi, Clyde.</h2>
            <p>Let's get a few things done.</p>
        </section>
        
        <div class="dashboard">
            <div class="task-panel">

        <form id="todoForm">
            <label for="todoInput">New Task</label>
            <input type="text" id="todoInput" placeholder="Enter a Task">
            <label for="todoEnergy">Energy Required</label>
            <select id="todoEnergy">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button type="submit">Add Task</button>
        </form>
        <p id="todoError" role="alert"></p>
        <section class="tasks">
            <h2>My Tasks</h2>
            <div class="task-filters" role="group" aria-label="Task Filters">
                <button type="button" data-filter="all" aria-pressed="true">
                    All
                </button>
                <button type="button" data-filter="active" aria-pressed="false">
                    Active
                </button>
                <button type="button" data-filter="completed" aria-pressed="false">
                    Completed
                </button>
            </div>

            <ul id="todoList">
</ul>
        </section>
        
    </div>
        
    <div class="sidebar">
        <section class="daily-progress">
            <h2>Daily progress</h2>
            <p id="todoCount" aria-live="polite">0 of 0 tasks completed.</p>
            <progress
                id="taskProgress"
                value="0"
                max="100"
                aria-label="Task completion"
            ></progress>
        </section>

        <section class="task-picker">
            <h2>Pick My Next Task</h2>
        </section>
        </div>
    </div>

    </main>

</body>
</html>
