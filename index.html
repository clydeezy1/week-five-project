<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Up - My Tasks</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scrip.js" defer></script>

</head>
<body>
    <header>
        <h1>Next UP</h1>
    </header>
    <main>
        <section class="greeting">
            <h2> Hi, Clyde.</h2>
            <p>Let's get a few things done.</p>
        </section>

        <form id="todoForm">
            <label for="todoInput">New Task</label>
            <input type="text" id="todoInput" placeholder="Enter a Task">
            <button type="submit">Add Task</button>
        </form>
        <p id="todoError" role="alert".></p>
        <section class="tasks">
            <h2>My Tasks</h2>
            <ul id="todoList">
                <!--<li placeholder="Sample Task 1" id="Sample Task1"></li>// -->
            </ul>
        </section>
    </main>

</body>
</html>
